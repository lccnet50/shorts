<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts 實體 AI 講座｜課程總覽</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F7F4FF;
    --ink-soft:#FFFFFF;
    --surface:#FFFFFF;
    --line:#E8E2F6;
    --mist:#7C7396;
    --paper:#2C2650;
    --pink:#D6296B;
    --cyan:#0E8CA6;
    --amber:#B45309;
    --violet:#6D28D9;
    --lime:#4D7C0F;
  }
  *{ font-family:'Noto Sans TC','Manrope',sans-serif; }
  body{ background:var(--ink); color:var(--paper); }
  .font-display{ font-family:'Manrope','Noto Sans TC',sans-serif; }

  .frame{
    position:absolute; border-radius:14px; border:2px solid rgba(214,41,107,.18);
    background:linear-gradient(155deg, rgba(255,255,255,.9), rgba(232,227,250,.5));
    box-shadow:0 14px 28px -16px rgba(44,38,80,.22);
  }
  .frame::after{
    content:''; position:absolute; inset:0; border-radius:12px;
    background:inherit; opacity:.9;
  }

  .glow-dot{ box-shadow:0 0 0 4px rgba(44,38,80,.05); }

  select, input{ color-scheme: light; }

  .tag{ font-weight:700; font-size:.72rem; padding:.28rem .6rem; border-radius:999px; display:inline-block; white-space:nowrap; }

  .row-card{ border:1px solid var(--line); background:var(--ink-soft); box-shadow:0 2px 10px -6px rgba(44,38,80,.12); }

  table thead th{ position:sticky; top:0; background:var(--ink); z-index:5; }

  ::selection{ background:var(--pink); color:white; }

  @media (prefers-reduced-motion: no-preference){
    .hero-rise{ animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .hero-rise-1{ animation-delay:.05s; }
    .hero-rise-2{ animation-delay:.15s; }
    .hero-rise-3{ animation-delay:.25s; }
    @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  }

  button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }

  .empty-state{ border:1px dashed var(--line); }
</style>
</head>

  // topic -> color mapping, so tags carry recognisable meaning rather than decoration
  const topicColors = {

  };
  const topicDescriptions = {
    "1小時學會用 AI 寫出高效 Email 與簡報": "用 AI 工具快速生成信件與簡報草稿，職場溝通不再卡關。",

    "Python 爬蟲體驗班：1小時抓取網路熱門數據": "寫幾行程式碼，練習抓取網路上的熱門話題與數據。",

    "GOOGLE 簡報美學：1小時打造高質感提案頁": "掌握版面、配色與字體搭配，讓提案一眼抓住注意力。",
    "零基礎！1小時用 Codex AI 生成個人網站": "用 AI 對話生成程式碼，打造屬於自己的個人網站。"
  };
  function topicStyle(name){
    const c = topicColors[name] || {bg:"rgba(44,38,80,.06)", fg:"#2C2650", bd:"rgba(44,38,80,.18)"};
    return `background:${c.bg}; color:${c.fg}; border:1px solid ${c.bd}`;
  }

  const regionOrder = ["北一區","北二區","桃竹區","中區","南一區","南二區"];

  const searchInput = document.getElementById('searchInput');
  const regionFilter = document.getElementById('regionFilter');
  const topicFilter = document.getElementById('topicFilter');
  const tableBody = document.getElementById('tableBody');
  const cardList = document.getElementById('cardList');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');

  function populateFilters(){
    const regions = [...new Set(courses.map(c => c.region))]
      .sort((a,b) => regionOrder.indexOf(a) - regionOrder.indexOf(b));
    regions.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      regionFilter.appendChild(opt);
    });
    const topics = [...new Set(courses.map(c => c.name))];
    topics.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      topicFilter.appendChild(opt);
    });
  }

  function render(){
    const kw = searchInput.value.trim().toLowerCase();
    const region = regionFilter.value;
    const topic = topicFilter.value;

    const filtered = courses.filter(c => {
      const matchesKw = !kw || c.name.toLowerCase().includes(kw) || c.school.toLowerCase().includes(kw);
      const matchesRegion = !region || c.region === region;
      const matchesTopic = !topic || c.name === topic;
      return matchesKw && matchesRegion && matchesTopic;
    });

    resultCount.textContent = `共 ${filtered.length} 堂課`;

    tableBody.innerHTML = '';
    cardList.innerHTML = '';

    if (filtered.length === 0){
      emptyState.classList.remove('hidden');
    } else {
      emptyState.classList.add('hidden');
    }

    filtered.forEach((c, i) => {
      // table row
      const tr = document.createElement('tr');
      tr.style.borderTop = '1px solid var(--line)';
      if (i % 2 === 1) tr.style.background = 'rgba(44,38,80,.03)';
      tr.innerHTML = `
        <td class="px-5 py-3.5 whitespace-nowrap font-bold">${c.date}</td>
        <td class="px-5 py-3.5 whitespace-nowrap" style="color:var(--mist)">${c.time}</td>
        <td class="px-5 py-3.5 whitespace-nowrap">${c.region}</td>
        <td class="px-5 py-3.5 whitespace-nowrap">${c.school}</td>
        <td class="px-5 py-3.5">
          <span class="tag" style="${topicStyle(c.name)}">${c.name}</span>
          <p class="text-xs mt-1.5 max-w-xs" style="color:var(--mist)">${topicDescriptions[c.name] || ''}</p>
        </td>`;
      tableBody.appendChild(tr);

      // mobile card
      const card = document.createElement('div');
      card.className = 'row-card rounded-2xl p-4';
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-bold text-base">${c.date}　${c.time}</p>
            <p class="text-sm mt-0.5" style="color:var(--mist)">${c.region}．${c.school}</p>
          </div>
        </div>
        <span class="tag mt-3" style="${topicStyle(c.name)}">${c.name}</span>
        <p class="text-sm mt-2" style="color:var(--mist)">${topicDescriptions[c.name] || ''}</p>`;
      cardList.appendChild(card);
    });
  }

  searchInput.addEventListener('input', render);
  regionFilter.addEventListener('change', render);
  topicFilter.addEventListener('change', render);
  document.getElementById('clearFilters').addEventListener('click', () => {
    searchInput.value = '';
    regionFilter.value = '';
    topicFilter.value = '';
    render();
  });

  populateFilters();
  render();
</script>
